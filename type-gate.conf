# tty-login-gate settings. install.sh copies this to /etc/type-gate.conf (only if it isn't there yet).
# Edit /etc/type-gate.conf, changes apply on the next attempt. Whole numbers only.

# wpm you must beat (strictly more than this)
GOAL=30

# minimum accuracy in percent (100 = no mistakes at all, even backspaced ones)
MIN_ACC=90

# advice list: easy (common words, short), medium (original wording) or hard (long lines, big words)
MODE=easy
